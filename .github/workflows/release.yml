name: Build, release and publish site

on:
  push:
    tags: ["v*", "[0-9]*"]    # e.g. git tag v1.0.0 && git push origin v1.0.0
  workflow_dispatch:          # "Run workflow" button
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0 (leave blank to only build)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  meta:
    name: Work out version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"; PUBLISH=true
          elif [[ -n "$INPUT_VERSION" ]]; then
            TAG="v${INPUT_VERSION#v}"; PUBLISH=true
          else
            TAG=""; PUBLISH=false
          fi
          VERSION="${TAG#v}"; VERSION="${VERSION:-0.0.0}"
          { echo "tag=$TAG"; echo "version=$VERSION"; echo "publish=$PUBLISH"; } >> "$GITHUB_OUTPUT"
          echo "Tag: '$TAG'  Version: $VERSION  Publish: $PUBLISH"

  build:
    name: Build (${{ matrix.name }})
    needs: meta
    runs-on: ${{ matrix.os }}
    env:
      APP_VERSION: ${{ needs.meta.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS,   os: macos-15 }
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: bash
        run: python -m pip install -r requirements.txt

      - name: Generate icons
        shell: bash
        run: python make_icons.py

      - name: Build app
        shell: bash
        run: python -m PyInstaller --noconfirm --clean --log-level ERROR MrBAI.spec

      - name: Sign app (ad-hoc)
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - "dist/Mr. B AI.app"

      - name: Smoke test (app starts and serves its login page)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXE="dist/MrBAI/MrBAI.exe"; DATA="$APPDATA/MrBAI"
          else
            EXE="dist/Mr. B AI.app/Contents/MacOS/MrBAI"; DATA="$HOME/Library/Application Support/MrBAI"
          fi
          "$EXE" --browser > smoke.log 2>&1 &
          PID=$!
          for i in $(seq 1 40); do [ -f "$DATA/port.txt" ] && break; sleep 1; done
          PORT=$(cat "$DATA/port.txt")
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 \
               "http://127.0.0.1:$PORT/login" > /dev/null
          echo "Smoke test passed on port $PORT"
          if [ "$RUNNER_OS" = "Windows" ]; then taskkill //F //IM MrBAI.exe > /dev/null || true; else kill $PID || true; fi

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /Q "/DAppVersion=$env:APP_VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build macOS disk image
        if: runner.os == 'macOS'
        run: |
          mkdir staging
          cp -R "dist/Mr. B AI.app" staging/
          ln -s /Applications staging/Applications
          hdiutil create -quiet -volname "Mr. B AI" -srcfolder staging -ov -format UDZO MrBAI-macOS.dmg

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: Windows
          path: installer/MrBAI-Setup.exe
          if-no-files-found: error

      - name: Upload macOS disk image
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: macOS
          path: MrBAI-macOS.dmg
          if-no-files-found: error

  release:
    name: Create GitHub release
    if: needs.meta.outputs.publish == 'true'
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          ls -l release
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Mr. B AI $TAG" --generate-notes
          fi

  pages:
    name: Update download page
    if: needs.meta.outputs.publish == 'true'
    needs: [meta, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Fill in version, date and repo
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          sed -i "s|__VERSION__|${VERSION}|g; s|__DATE__|$(date -u +'%B %-d, %Y')|g; s|__REPO__|${GITHUB_REPOSITORY}|g" docs/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v5
