name: Build, release and publish site

on:
  push:
    tags: ["v*"]          # e.g. git tag v1.0.0 && git push origin v1.0.0
  workflow_dispatch:      # manual run: builds and uploads artifacts, no release

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS,   os: macos-15 }
    steps:
      - uses: actions/checkout@v6

      - name: Set version (tag v1.2.3 becomes 1.2.3; manual runs use 0.0.0)
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0"; fi
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: bash
        run: python -m pip install -r requirements.txt

      - name: Generate icons
        shell: bash
        run: python make_icons.py

      - name: Build app
        shell: bash
        run: python -m PyInstaller --noconfirm --clean --log-level ERROR MrBAI.spec

      - name: Sign app (ad-hoc)
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - "dist/Mr. B AI.app"

      - name: Smoke test (app starts and serves its login page)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXE="dist/MrBAI/MrBAI.exe"; DATA="$APPDATA/MrBAI"
          else
            EXE="dist/Mr. B AI.app/Contents/MacOS/MrBAI"; DATA="$HOME/Library/Application Support/MrBAI"
          fi
          "$EXE" --browser > smoke.log 2>&1 &
          PID=$!
          for i in $(seq 1 40); do [ -f "$DATA/port.txt" ] && break; sleep 1; done
          PORT=$(cat "$DATA/port.txt")
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 \
               "http://127.0.0.1:$PORT/login" > /dev/null
          echo "Smoke test passed on port $PORT"
          if [ "$RUNNER_OS" = "Windows" ]; then taskkill //F //IM MrBAI.exe > /dev/null || true; else kill $PID || true; fi

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /Q "/DAppVersion=$env:APP_VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build macOS disk image
        if: runner.os == 'macOS'
        run: |
          mkdir staging
          cp -R "dist/Mr. B AI.app" staging/
          ln -s /Applications staging/Applications
          hdiutil create -quiet -volname "Mr. B AI" -srcfolder staging -ov -format UDZO MrBAI-macOS.dmg

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: Windows
          path: installer/MrBAI-Setup.exe
          if-no-files-found: error

      - name: Upload macOS disk image
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: macOS
          path: MrBAI-macOS.dmg
          if-no-files-found: error

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l release
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" \
              --title "Mr. B AI $GITHUB_REF_NAME" --generate-notes
          fi

  pages:
    name: Update download page
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Fill in version, date and repo
        run: |
          sed -i "s|__VERSION__|${GITHUB_REF_NAME#v}|g; s|__DATE__|$(date -u +'%B %-d, %Y')|g; s|__REPO__|${GITHUB_REPOSITORY}|g" docs/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v5
